global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files: [/etc/prometheus/alerts.yaml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
scrape_configs:
  - job_name: api
    static_configs:
      - targets: ['api:9090']
  - job_name: publisher
    static_configs:
      - targets: ['publisher:9090']
  - job_name: workers
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 9090
  - job_name: rabbitmq
    metrics_path: /metrics/per-object
    static_configs:
      - targets: ['rabbitmq:15692']
